<!DOCTYPE html>
<html>
<head>
    <title>Read View</title>
    <link rel="stylesheet" href="{{url_for('static',filename='read.css')}}">
</head>
<body>

<div class="top">


    <form  action="/">
        <button class="home-pg" type="submit"> 🏠 </button>
    </form>


   

    <button class="back" onclick="history.back()">◀</button>

   

    <form   action="/edit/{{note[0]}}" method="GET"  style="display:inline;">
        <button class="edit-btn" type="submit">🖋</button>
    </form>

    <form class="button_e"  action="/delete/{{note[0]}}" method="POST"  style="display:inline;">
        <button class="del-btn" type="submit">🗑</button>
    </form>

    <h1 style="display:inline;" >Note</h1>
    <hr>

</div>



<p>{{ note[1] }}</p>

</form>

</body>
</html>
